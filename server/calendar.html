<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Outlook - Nube Personal</title>
    <link rel="icon" href="/icons/nube.svg" type="image/svg+xml">

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css" rel="stylesheet">

    <!-- Custom Calendar Styles -->
    <link rel="stylesheet" href="/calendario.css">
</head>
<body>
    <div class="bg"></div>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">
                <img class="logo-img" src="/icons/nube.svg" alt="Nube" />
                <span>Calendario Outlook</span>
            </div>
        </div>
        <div class="nav-buttons">
            <a href="/" class="nav-btn secondary">⬅️ Volver al Panel</a>
            <button class="nav-btn" onclick="logout()">🚪 Cerrar sesión</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="calendar-wrapper">
            <div class="calendar-container">
                <!-- Calendar will be rendered here -->
                <div id="calendar"></div>
            </div>
        </div>

        <!-- Categories Toggle Button -->
        <button class="categories-toggle" id="categoriesToggle" onclick="toggleCategoriesPanel()">
            🏷️
        </button>

        <!-- Categories Panel -->
        <div class="categories-panel" id="categoriesPanel">
            <div class="categories-header">
                <h3>🏷️ Categorías</h3>
            </div>

            <div class="categories-actions">
                <button class="category-action-btn" onclick="selectAllCategories()">✅ Todas</button>
                <button class="category-action-btn" onclick="deselectAllCategories()">❌ Ninguna</button>
            </div>

            <div class="categories-list" id="categoriesList">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Cargando categorías...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

    <!-- Calendar JavaScript -->
    <script>
        let calendar;
        let categories = [];
        let selectedCategories = new Set();

        // Initialize calendar when page loads
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthentication();
        });

        async function checkAuthentication() {
            try {
                const response = await fetch('/api/auth/status', {
                    credentials: 'include'
                });

                if (response.ok) {
                    const statusData = await response.json();
                    if (statusData.authenticated) {
                        loadCategories();
                        initializeCalendar();
                    } else {
                        showAuthRequired();
                    }
                } else {
                    showAuthRequired();
                }
            } catch (error) {
                console.error('Error checking authentication:', error);
                showAuthRequired();
            }
        }

        function showAuthRequired() {
            document.querySelector('.calendar-wrapper').innerHTML = `
                <div class="auth-card">
                    <h2>🔐 Conecta tu cuenta de Outlook</h2>
                    <p>Para acceder al calendario de Outlook, necesitas conectar tu cuenta de Microsoft.</p>
                    <button class="nav-btn" onclick="login()">
                        🚀 Conectar con Microsoft Outlook
                    </button>
                </div>
            `;
        }

        function login() {
            window.location.href = '/api/auth/login';
        }

        async function logout() {
            try {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
            } catch (error) {
                console.error('Error during logout:', error);
            }
            window.location.href = '/';
        }

        async function loadCategories() {
            try {
                const response = await fetch('/api/events/categories', {
                    credentials: 'include'
                });

                if (response.ok) {
                    categories = await response.json();
                    // Add "Sin categoría" category
                    categories.push({
                        id: 'no-category',
                        name: 'Sin categoría',
                        color: 'preset8',
                        hexColor: '#c0c0c0'
                    });

                    selectedCategories = new Set(categories.map(cat => cat.name));
                    renderCategories();
                }
            } catch (error) {
                console.error('Error loading categories:', error);
                document.getElementById('categoriesList').innerHTML = `
                    <div class="error-message">
                        Error al cargar categorías
                    </div>
                `;
            }
        }

        function renderCategories() {
            const categoriesList = document.getElementById('categoriesList');
            categoriesList.innerHTML = categories.map(category => `
                <div class="category-item ${selectedCategories.has(category.name) ? 'selected' : ''}">
                    <input
                        type="checkbox"
                        id="cat-${category.id}"
                        ${selectedCategories.has(category.name) ? 'checked' : ''}
                        onchange="toggleCategory('${category.name}')"
                    />
                    <div class="category-color" style="background-color: ${category.hexColor}"></div>
                    <label for="cat-${category.id}" class="category-label">${category.name}</label>
                </div>
            `).join('');
        }

        function initializeCalendar() {
            const calendarEl = document.getElementById('calendar');

            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                timeZone: 'Europe/Madrid',
                firstDay: 1,
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: {
                    today: 'Hoy',
                    month: 'Mes',
                    week: 'Semana',
                    day: 'Día'
                },
                height: 'auto',
                editable: true,
                selectable: true,
                selectMirror: true,
                dayMaxEvents: true,
                eventResizableFromStart: true,

                eventTimeFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                },

                slotLabelFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                },

                events: async function(fetchInfo, successCallback, failureCallback) {
                    try {
                        const response = await fetch(`/api/events?start=${encodeURIComponent(fetchInfo.startStr)}&end=${encodeURIComponent(fetchInfo.endStr)}`, {
                            credentials: 'include'
                        });

                        if (response.ok) {
                            const events = await response.json();
                            const filteredEvents = events.filter(event => {
                                if (selectedCategories.size === 0) return false;
                                if (!event.extendedProps?.categories || event.extendedProps.categories.length === 0) {
                                    return selectedCategories.has('Sin categoría');
                                }
                                return event.extendedProps.categories.some(category => selectedCategories.has(category));
                            });
                            successCallback(filteredEvents);
                        } else {
                            failureCallback(new Error('Error loading events'));
                        }
                    } catch (error) {
                        failureCallback(error);
                    }
                },

                select: function(info) {
                    // TODO: Open event modal
                    console.log('Date selected:', info);
                    calendar.unselect();
                },

                eventClick: function(info) {
                    console.log('Event clicked:', info.event);
                    // TODO: Open event modal
                },

                eventDrop: async function(info) {
                    await updateEventDates(info.event, info.event.start, info.event.end, info.revert);
                },

                eventResize: async function(info) {
                    await updateEventDates(info.event, info.event.start, info.event.end, info.revert);
                }
            });

            calendar.render();
        }

        async function updateEventDates(event, newStart, newEnd, revertFunc) {
            try {
                const response = await fetch(`/api/events/${event.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        title: event.title,
                        start: newStart.toISOString(),
                        end: newEnd ? newEnd.toISOString() : null,
                        allDay: event.allDay
                    })
                });

                if (!response.ok) {
                    throw new Error('Error updating event');
                }

                console.log('Event updated:', event.title);
            } catch (error) {
                console.error('Error updating event:', error);
                if (typeof revertFunc === 'function') {
                    revertFunc();
                }
            }
        }

        function toggleCategory(categoryName) {
            if (selectedCategories.has(categoryName)) {
                selectedCategories.delete(categoryName);
            } else {
                selectedCategories.add(categoryName);
            }
            renderCategories();
            if (calendar) {
                calendar.refetchEvents();
            }
        }

        function selectAllCategories() {
            selectedCategories = new Set(categories.map(cat => cat.name));
            renderCategories();
            if (calendar) {
                calendar.refetchEvents();
            }
        }

        function deselectAllCategories() {
            selectedCategories.clear();
            renderCategories();
            if (calendar) {
                calendar.refetchEvents();
            }
        }

        function toggleCategoriesPanel() {
            const panel = document.getElementById('categoriesPanel');
            const toggle = document.getElementById('categoriesToggle');

            if (panel.classList.contains('open')) {
                panel.classList.remove('open');
                toggle.classList.remove('panel-open');
            } else {
                panel.classList.add('open');
                toggle.classList.add('panel-open');
            }
        }
    </script>
</body>
</html>
