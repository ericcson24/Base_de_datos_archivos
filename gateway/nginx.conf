events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11:53 valid=30s ipv6=off;
    resolver_timeout 10s;

    # Keepalive settings for upstream connections
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    server {
        listen 80;
        absolute_redirect off;
        proxy_redirect http:// https://;

        # Health check endpoint for cloudflared/Docker
        location = /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        set $frontend_upstream http://frontend:80;
        set $auth_upstream http://auth-service:5001;
        set $file_upstream http://file-service:5004;
        set $user_upstream http://user-service:5005;
        set $events_upstream http://outlook-service:5003;
        set $admin_upstream http://admin-service:5006;
        set $rdp_upstream http://rdp-service:5008;
        set $notifications_upstream http://notification-service:5002;
        set $ai_upstream http://ai-service:5009;

        # --- Security Headers ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Hide server version
        server_tokens off;

        # Default proxy connect timeout
        proxy_connect_timeout 10s;

        # Frontend
        location / {
            proxy_pass $frontend_upstream;
            
            # Tiempos de espera ampliados (Sugerencia aplicada)
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_read_timeout 300;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Auth Service
        location /api/auth/ {
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass $auth_upstream;
            client_max_body_size 20M;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # File Service
        location /api/files/ {
            rewrite ^/api/files/(.*)$ /$1 break;
            proxy_pass $file_upstream;
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # User Service
        location /api/users/ {
            rewrite ^/api/users/(.*)$ /$1 break;
            proxy_pass $user_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Outlook Service (Events)
        location /api/events/ {
            rewrite ^/api/events/(.*)$ /$1 break;
            proxy_pass $events_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Admin Service
        location /admin/api/ {
            rewrite ^/admin/api/(.*)$ /api/$1 break;
            proxy_pass $admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # RDP Service - WebSocket (root endpoint with query string)
        location = /api/rdp {
            proxy_pass $rdp_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Original-URI $request_uri;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # RDP Service - API endpoints (with path)
        location /api/rdp/ {
            rewrite ^/api/rdp/(.*)$ /$1 break;
            proxy_pass $rdp_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Original-URI $request_uri;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Notification Service (WebSockets / New endpoints)
        location /api/notifications/ {
            rewrite ^/api/notifications/(.*)$ /$1 break;
            proxy_pass $notifications_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # AI Service
        location /api/ai/ {
            rewrite ^/api/ai/(.*)$ /$1 break;
            proxy_pass $ai_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
