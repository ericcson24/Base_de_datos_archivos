services:
  # --- Frontend (React) ---
  frontend:
    build: 
      context: ./front
      network: host
    networks:
      - app-network

  # --- API Gateway ---
  gateway:
    build: 
      context: ./gateway
      network: host
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - auth-service
      - notification-service
      - outlook-service
      - file-service
      - user-service
      - admin-service
      - email-service
      - ai-service
      - rdp-service
    networks:
      - app-network

  # --- AI Service (5009) ---
  ai-service:
    build: 
      context: ./services/ai-service
      network: host
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_NAME=${DB_NAME:-server_db}
      - PORT=5009
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ../Datos:/app/uploads
      - ../Tests/test_data:/app/test_data
    depends_on:
      - postgres
    networks:
      - app-network

  # --- Postgres Database (Production) ---
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-server_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - app-network

  # --- Auth Service (5001) ---
  auth-service:
    build: 
      context: ./services/auth-service
      network: host
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_NAME=${DB_NAME:-server_db}
      - PORT=5001
      - JWT_SECRET=${JWT_SECRET}
      - MICROSOFT_CLIENT_ID=${MS_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-http://localhost/api/auth/microsoft/callback}
      - DB_PATH=/data/server.db
    volumes:
      - ../database_storage:/data
      - ../database_storage/avatars:/app/uploads
    networks:
      - app-network

  # --- Notification Service (5002) ---
  notification-service:
    build: 
      context: ./services/notification-service
      network: host
    environment:
      - PORT=5002
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_NAME=${DB_NAME:-server_db}
    depends_on:
      - redis
      - postgres
    networks:
      - app-network

  # --- Outlook Service (5003) ---
  outlook-service:
    build: 
      context: ./services/outlook-service
      network: host
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_NAME=${DB_NAME:-server_db}
      - PORT=5003
      - JWT_SECRET=${JWT_SECRET}
      - MS_CLIENT_ID=${MS_CLIENT_ID}
      - MS_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - DB_PATH=/data/server.db
    volumes:
      - ../database_storage:/data
    networks:
      - app-network

  # --- File Service (5004) ---
  file-service:
    build: 
      context: ./services/file-service
      network: host
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_NAME=${DB_NAME:-server_db}
      - PORT=5004
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/server.db
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ../database_storage:/data
      - ../Datos:/app/uploads
    networks:
      - app-network

  # --- User Service (5005) ---
  user-service:
    build: 
      context: ./services/user-service
      network: host
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_NAME=${DB_NAME:-server_db}
      - PORT=5005
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/server.db
    volumes:
      - ../database_storage:/data
    networks:
      - app-network

  # --- Admin Service (5006) ---
  admin-service:
    build: 
      context: ./services/admin-service
      network: host
    environment:
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_NAME=${DB_NAME:-server_db}
      - PORT=5006
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/server.db
      - EMAIL_SERVICE_URL=http://email-service:5007
      - AUTH_SERVICE_URL=http://auth-service:5001
    volumes:
      - ../database_storage:/data
    networks:
      - app-network

  # --- Email Service (5007) ---
  email-service:
    build: 
      context: ./services/email-service
      network: host
    environment:
      - PORT=5007
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    networks:
      - app-network

  # --- RDP Service (5008) ---
  rdp-service:
    build: 
      context: ./services/rdp-service
      network: host
    restart: unless-stopped
    expose:
      - "5008"
    environment:
      - PORT=5008
      - GUACD_HOST=guacd
      - GUACD_PORT=4822
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_NAME=${DB_NAME:-server_db}
      - DB_PORT=5432
      - RDP_SERVER_HOST=${RDP_SERVER_HOST:-host.docker.internal}
      - RDP_SERVER_PORT=${RDP_SERVER_PORT:-3389}
    depends_on:
      - guacd
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rdp_shared:/shared
    networks:
      - app-network

  # --- Guacamole Daemon ---
  guacd:
    image: guacamole/guacd
    restart: unless-stopped
    expose:
      - "4822"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4822 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - rdp_shared:/shared
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Redis (Message Broker) ---
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  # --- Cloudflare Tunnel (Global Access) ---
  tunnel:
    image: cloudflare/cloudflared:latest
    # Use token from environment and force http2 protocol
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN} --protocol http2
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - app-network
    depends_on:
      - gateway
    

volumes:
  postgres_data:
  rdp_shared:

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
